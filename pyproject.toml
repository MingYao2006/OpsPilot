[project]
name = "opspilot"
version = "0.1.0"
description = "企业内部运维知识 Agent：混合检索 RAG + LangGraph 编排 + 引用溯源与拒答"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    "langgraph>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10"]
pg = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
